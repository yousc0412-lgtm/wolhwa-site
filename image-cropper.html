<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>무료 이미지 자르기 | JPG PNG WEBP 크롭 | 월화</title>
<meta name="description" content="프로그램 설치 없이 JPG, PNG, WEBP 이미지를 원하는 영역으로 자르고 저장하세요. 브라우저에서 바로 사용하는 무료 이미지 크롭 도구입니다.">
<link rel="stylesheet" href="style.css">
<style>
.cropper{max-width:820px;margin:0 auto}.drop{border:1px dashed var(--line);background:var(--surface);border-radius:18px;padding:42px 20px;text-align:center;cursor:pointer}.drop.drag{border-color:var(--accent);background:var(--surface-2)}.drop strong{display:block;font-size:20px;margin-bottom:8px}.drop small,.hint{color:var(--muted)}.panel{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}.stage{position:relative;display:flex;justify-content:center;align-items:center;min-height:280px;background:#0b0d0f;border-radius:14px;overflow:hidden;touch-action:none}.stage img{display:block;max-width:100%;max-height:520px;user-select:none}.box{position:absolute;border:2px solid var(--accent);background:rgba(255,255,255,.06);cursor:move;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;text-decoration:none}.primary{background:var(--accent);color:#10120d}.secondary{background:var(--surface-3);color:var(--text);border:1px solid var(--line)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.field input,.field select{width:100%;box-sizing:border-box;background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.stat{background:var(--surface-2);padding:10px 12px;border-radius:10px}.notice{font-size:13px;line-height:1.6;color:var(--muted)}@media(max-width:700px){.row{grid-template-columns:1fr}}
</style></head>
<body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">月花</span><span>월화 <b>이미지 자르기</b></span></a><nav><a href="calculators.html">계산기</a><a href="timers.html">타이머</a><a href="downloads.html">다운로드·도구</a><a href="blog.html">블로그</a></nav></header>
<main><section class="category-hero"><p class="eyebrow">IMAGE CROP</p><h1>필요한 부분만<br><span>깔끔하게 잘라보세요.</span></h1><p>이미지를 선택하고 영역을 드래그한 뒤 바로 저장할 수 있어요.</p></section>
<section class="section cropper"><div id="drop" class="drop"><strong>이미지를 여기에 놓거나 클릭해서 선택</strong><small>JPG · PNG · WEBP 지원 · 브라우저에서 바로 처리</small><input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden></div>
<div id="panel" class="panel" hidden><div id="stage" class="stage"><img id="img" alt="자르기 대상 이미지"><div id="box" class="box"></div></div>
<div class="stats"><div class="stat">선택 영역 <b id="sel">-</b></div><div class="stat">원본 <b id="orig">-</b></div></div>
<div class="row" style="margin-top:16px"><div class="field"><label for="format">저장 형식</label><select id="format"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WEBP</option></select></div><div class="field"><label for="quality">JPG·WEBP 품질</label><input id="quality" type="range" min="10" max="100" value="92"><div class="hint" id="qv">92%</div></div></div>
<div class="actions"><button id="crop" class="btn primary">선택 영역 자르기</button><button id="full" class="btn secondary">전체 영역</button><button id="reset" class="btn secondary">초기화</button></div><p id="status" class="notice">이미지를 선택한 뒤 박스를 드래그해 원하는 부분을 지정하세요.</p><div id="result" hidden><div class="panel" style="padding:12px;margin-top:16px"><img id="out" alt="자른 이미지 결과" style="display:block;width:100%;max-height:420px;object-fit:contain;background:#0b0d0f;border-radius:10px"><div class="actions"><a id="download" class="btn primary" download>자른 이미지 다운로드</a></div></div></div></div></section></main>
<footer class="site-footer"><a class="brand" href="image-tools.html"><span class="brand-mark">月花</span><span>월화 <b>이미지 도구</b></span></a><p><a href="image-tools.html">← 이미지 도구로 돌아가기</a></p></footer>
<script>
const $=s=>document.querySelector(s),file=$('#file'),drop=$('#drop'),panel=$('#panel'),stage=$('#stage'),img=$('#img'),box=$('#box'),sel=$('#sel'),orig=$('#orig'),format=$('#format'),quality=$('#quality'),qv=$('#qv'),status=$('#status'),result=$('#result'),out=$('#out'),download=$('#download');
let source=null,dragging=false,startX=0,startY=0,rect={x:0,y:0,w:0,h:0};
function choose(f){if(!f||!f.type.startsWith('image/'))return; if(source)URL.revokeObjectURL(source);source=URL.createObjectURL(f);img.onload=()=>{panel.hidden=false;drop.style.display='none';orig.textContent=img.naturalWidth+' × '+img.naturalHeight;setFull()};img.src=source}
drop.onclick=()=>file.click();file.onchange=e=>choose(e.target.files[0]);
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>choose(e.dataTransfer.files[0]));
function setBox(){box.style.left=rect.x+'px';box.style.top=rect.y+'px';box.style.width=rect.w+'px';box.style.height=rect.h+'px';sel.textContent=Math.max(1,Math.round(rect.w/img.clientWidth*img.naturalWidth))+' × '+Math.max(1,Math.round(rect.h/img.clientHeight*img.naturalHeight))}
function setFull(){rect={x:Math.max(0,(stage.clientWidth-img.clientWidth)/2),y:Math.max(0,(stage.clientHeight-img.clientHeight)/2),w:img.clientWidth,h:img.clientHeight};setBox()}
function point(e){const r=stage.getBoundingClientRect();return{x:Math.max(0,Math.min(stage.clientWidth,e.clientX-r.left)),y:Math.max(0,Math.min(stage.clientHeight,e.clientY-r.top))}}
function cropRect(a,b){const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),w=Math.abs(a.x-b.x),h=Math.abs(a.y-b.y);return{x,y,w,h}}
stage.addEventListener('pointerdown',e=>{if(e.target===box)return;const p=point(e);startX=p.x;startY=p.y;dragging=true;stage.setPointerCapture(e.pointerId);rect={x:p.x,y:p.y,w:0,h:0};setBox()});
stage.addEventListener('pointermove',e=>{if(!dragging)return;rect=cropRect({x:startX,y:startY},point(e));setBox()});
stage.addEventListener('pointerup',()=>{dragging=false;if(rect.w<10||rect.h<10)setFull()});
box.addEventListener('pointerdown',e=>{e.stopPropagation();const p=point(e),ox=p.x,oy=p.y,base={...rect};const move=ev=>{const q=point(ev);rect={x:Math.max(0,Math.min(stage.clientWidth-base.w,q.x-(ox-base.x))),y:Math.max(0,Math.min(stage.clientHeight-base.h,q.y-(oy-base.y))),w:base.w,h:base.h};setBox()};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)});
$('#full').onclick=setFull;quality.oninput=()=>qv.textContent=quality.value+'%';
$('#crop').onclick=()=>{if(!img.naturalWidth||rect.w<2)return;const scaleX=img.naturalWidth/img.clientWidth,scaleY=img.naturalHeight/img.clientHeight;const x=(rect.x-(stage.clientWidth-img.clientWidth)/2)*scaleX,y=(rect.y-(stage.clientHeight-img.clientHeight)/2)*scaleY,w=rect.w*scaleX,h=rect.h*scaleY;const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));const ctx=c.getContext('2d');if(format.value==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height)}ctx.drawImage(img,Math.max(0,x),Math.max(0,y),c.width,c.height,0,0,c.width,c.height);c.toBlob(b=>{const u=URL.createObjectURL(b);out.src=u;download.href=u;download.download='cropped.'+format.value.split('/')[1].replace('jpeg','jpg');result.hidden=false;status.textContent='자르기가 완료됐어요. 결과 파일을 다운로드하세요.'},format.value,(format.value==='image/jpeg'||format.value==='image/webp')?Number(quality.value)/100:undefined)};
$('#reset').onclick=()=>location.reload();
window.addEventListener('resize',()=>{if(img.src) setFull()});
</script></body></html>
