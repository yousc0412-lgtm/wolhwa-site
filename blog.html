<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>월화 블로그</title><meta name="description" content="월화의 생활정보, 금융정보, 세금, 급여와 계산기 활용법을 소개합니다.">
<link rel="stylesheet" href="style.css"></head>
<body>
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">月花</span><span>월화 <b>계산기</b></span></a><nav><a href="calculators.html">계산기</a><a href="downloads.html">다운로드·도구</a><a href="blog.html">블로그</a></nav></header>
<main class="blog-page">
<section class="category-hero"><p class="eyebrow">WOLHWA BLOG</p><h1>생활에 도움 되는<br><span>정보와 계산법.</span></h1><p>생활금융, 세금, 급여와 계산기 사용법을 소개합니다.</p></section>
<section class="section"><div class="section-heading"><div><p class="eyebrow">LATEST POSTS</p><h2>블로그 글</h2></div></div><div id="posts" class="posts"><p>게시글을 불러오는 중입니다.</p></div></section>
</main>
<footer class="site-footer"><a class="brand" href="index.html"><span class="brand-mark">月花</span><span>월화 <b>계산기</b></span></a><p>계산기와 유용한 정보를 한곳에서.</p><div class="footer-links"><a href="privacy.html">개인정보 처리 안내</a></div></footer>
<script>
const box=document.querySelector('#posts');
fetch('/api/posts').then(r=>r.ok?r.json():Promise.reject()).then(data=>{
 const posts=data.posts||[];box.replaceChildren();
 if(!posts.length){box.innerHTML='<article class="post"><h2>첫 글을 준비하고 있어요</h2><p>관리자 페이지에서 첫 게시글을 작성하면 여기에 표시됩니다.</p></article>';return}
 for(const p of posts){
  const a=document.createElement('article');a.className='post';
  const d=document.createElement('div');d.className='post-meta';d.textContent=new Date(p.created_at).toLocaleDateString('ko-KR');
  const h=document.createElement('h2');h.textContent=p.title;
  const b=document.createElement('p');b.className='post-body';b.textContent=p.body;
  a.append(d,h,b);box.append(a)
 }
}).catch(()=>{box.textContent='게시글을 불러오지 못했습니다. 잠시 후 다시 확인해 주세요.'});
</script>
</body></html>
