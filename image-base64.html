<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>이미지 Base64 변환 | 월화</title><meta name="description" content="JPG, PNG, WebP 이미지를 Base64 문자열로 변환하고 복사할 수 있는 무료 온라인 도구.">
<link rel="stylesheet" href="style.css"><style>
.b64-tool{max-width:1000px;margin:0 auto;padding:0 20px 80px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px}.drop{display:block;border:1px dashed var(--line);border-radius:18px;padding:36px 20px;text-align:center;background:var(--surface-2);cursor:pointer}.drop strong{display:block;font-size:18px;margin-bottom:8px}.drop small{color:var(--muted)}.file{display:none}.result{margin-top:20px}.result textarea{width:100%;min-height:240px;box-sizing:border-box;background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px;resize:vertical;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.info div{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px}.info small{display:block;color:var(--muted);margin-bottom:5px}.actions{display:flex;gap:10px;margin-top:12px}.actions button{border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:12px;padding:12px 16px;cursor:pointer}.actions .primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}.hint{color:var(--muted);font-size:13px;line-height:1.7;margin-top:15px}@media(max-width:700px){.info{grid-template-columns:1fr}.panel{padding:16px}}
</style></head>
<body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">月花</span><span>월화 <b>이미지 도구</b></span></a><nav><a href="calculators.html">계산기</a><a href="timers.html">타이머</a><a href="downloads.html">다운로드·도구</a><a href="blog.html">블로그</a></nav></header>
<main><section class="category-hero"><p class="eyebrow">IMAGE BASE64</p><h1>이미지를<br><span>Base64로 바꿔요.</span></h1><p>이미지 파일을 Base64 문자열로 변환하고 바로 복사할 수 있어요.</p></section>
<section class="b64-tool"><div class="panel"><label class="drop" id="drop" for="file"><strong>이미지를 여기에 끌어놓거나 클릭해서 선택</strong><small>JPG · PNG · WebP 지원 / 브라우저에서 바로 처리</small><input id="file" class="file" type="file" accept="image/jpeg,image/png,image/webp"></label>
<div class="result"><div class="info"><div><small>파일명</small><b id="name">-</b></div><div><small>파일 크기</small><b id="size">-</b></div><div><small>문자열 길이</small><b id="length">-</b></div></div>
<textarea id="output" readonly placeholder="이미지를 선택하면 Base64 문자열이 여기에 표시됩니다."></textarea>
<div class="actions"><button id="copy" class="primary" type="button">Base64 복사</button><button id="reset" type="button">초기화</button></div><p class="hint">이미지는 서버에 업로드하지 않고 브라우저의 FileReader로 변환합니다. Base64는 HTML/CSS에서 작은 이미지를 직접 넣거나 API 테스트 등에 활용할 수 있어요.</p></div></div></section></main>
<footer class="site-footer"><a class="brand" href="image-tools.html"><span class="brand-mark">月花</span><span>월화 <b>이미지 도구</b></span></a><p><a href="image-tools.html">← 이미지 도구로 돌아가기</a></p></footer>
<script>
const file=document.getElementById('file'),drop=document.getElementById('drop'),output=document.getElementById('output'),nameEl=document.getElementById('name'),sizeEl=document.getElementById('size'),lengthEl=document.getElementById('length');
function formatBytes(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(2)+' MB'}
function setFile(f){if(!f||!f.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>{output.value=reader.result;nameEl.textContent=f.name;sizeEl.textContent=formatBytes(f.size);lengthEl.textContent=reader.result.length.toLocaleString()+'자'};reader.readAsDataURL(f)}
file.addEventListener('change',e=>setFile(e.target.files[0]));
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('dragover')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('dragover')}));
drop.addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));
document.getElementById('copy').onclick=async()=>{if(!output.value)return alert('먼저 이미지를 선택해주세요.');try{await navigator.clipboard.writeText(output.value);alert('Base64가 복사됐어요.')}catch{output.select();document.execCommand('copy');alert('Base64가 복사됐어요.')}};
document.getElementById('reset').onclick=()=>{file.value='';output.value='';nameEl.textContent='-';sizeEl.textContent='-';lengthEl.textContent='-'};
</script></body></html>
