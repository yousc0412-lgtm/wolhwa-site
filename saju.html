<script type="module">
import { calculateFourPillars, solarToLunar, lunarToSolar, getHeavenlyStemElement, getEarthlyBranchElement } from 'https://esm.sh/manseryeok@2.0.0';

const form=document.getElementById('sajuForm');
const result=document.getElementById('result');
const yearEl=document.getElementById('birthYear'), monthEl=document.getElementById('birthMonth'), dayEl=document.getElementById('birthDay');
const time=document.getElementById('birthTime'), unknownTime=document.getElementById('unknownTime'), leapEl=document.getElementById('isLeap'), leapWrap=document.getElementById('leapWrap');
const hint=document.getElementById('calendarHint');
const place=document.getElementById('birthPlace'), longitude=document.getElementById('longitude'), placeApply=document.getElementById('placeApply'), placeHint=document.getElementById('placeHint');
placeApply.addEventListener('click',()=>{const v=Number(longitude.value);placeHint.textContent=(v>=124&&v<=132)?'경도 '+v.toFixed(4)+'°E가 적용돼.':'대한민국 출생지라면 보통 124~132°E 범위야.';});
unknownTime.addEventListener('change',()=>{time.disabled=unknownTime.checked;time.title=unknownTime.checked?'출생시간 미상으로 시주는 참고하지 않아.':'';});
let calendar='solar';

const stems=['갑','을','병','정','무','기','경','신','임','계'];
const branches=['자','축','인','묘','진','사','오','미','신','유','술','해'];
const stemHanja=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const branchHanja=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const elemHanja={목:'木',화:'火',토:'土',금:'金',수:'水'};
const zodiac={자:'쥐',축:'소',인:'호랑이',묘:'토끼',진:'용',사:'뱀',오:'말',미:'양',신:'원숭이',유:'닭',술:'개',해:'돼지'};const hiddenStems={자:['임','계'],축:['계','신','기'],인:['무','병','갑'],묘:['갑','을'],진:['을','계','무'],사:['무','경','병'],오:['병','기','정'],미:['정','을','기'],신:['무','임','경'],유:['경','신'],술:['신','정','무'],해:['무','갑','임']};
const twelveNames=['장생','목욕','관대','건록','제왕','쇠','병','사','묘','절','태','양'];
const twelveStart={갑:'해',을:'오',병:'인',정:'유',무:'인',기:'유',경:'사',신:'자',임:'신',계:'묘'};
const branchIndex=Object.fromEntries(branches.map((x,i)=>[x,i]));
function lifeStage(stem,branch){const s=branchIndex[twelveStart[stem]],b=branchIndex[branch],yin=['을','정','기','신','계'].includes(stem);return twelveNames[yin?(s-b+12)%12:(b-s+12)%12]}
const branchRelations={충:[['자','오'],['축','미'],['인','신'],['묘','유'],['진','술'],['사','해']],육합:[['자','축'],['인','해'],['묘','술'],['진','유'],['사','신'],['오','미']],해:[['자','미'],['축','오'],['인','사'],['묘','진'],['신','해'],['유','술']],파:[['자','유'],['축','진'],['인','해'],['묘','午'],['신','사'],['미','술']]};
function findRelations(r){const ps=[r.year,r.month,r.day,r.hour].filter(Boolean),out=[];for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++)for(const type of Object.keys(branchRelations))for(const pair of branchRelations[type]){const a=pair[0],b=pair[1].replace('午','오');if((ps[i].earthlyBranch===a&&ps[j].earthlyBranch===b)||(ps[i].earthlyBranch===b&&ps[j].earthlyBranch===a))out.push(type+' · '+a+b)}return [...new Set(out)]}
function hiddenText(branch){return (hiddenStems[branch]||[]).map(x=>x+'('+getHeavenlyStemElement(x)+')').join(' · ')}
function elementCycle(el){const m={목:{생:'수',극:'토',피극:'금',설:'화'},화:{생:'목',극:'금',피극:'수',설:'토'},토:{생:'화',극:'수',피극:'목',설:'금'},금:{생:'토',극:'목',피극:'화',설:'수'},수:{생:'금',극:'화',피극:'토',설:'목'}};return m[el]}
function strengthAnalysis(r){const dayEl=getHeavenlyStemElement(r.day.heavenlyStem),s={목:0,화:0,토:0,금:0,수:0},add=(e,v)=>{if(s[e]!=null)s[e]+=v};add(dayEl,2);[r.year,r.month,r.day,r.hour].filter(Boolean).forEach((p,i)=>{add(getHeavenlyStemElement(p.heavenlyStem),i===1?2:1);add(getEarthlyBranchElement(p.earthlyBranch),i===1?4:i===2?3:1);(hiddenStems[p.earthlyBranch]||[]).forEach((x,j)=>add(getHeavenlyStemElement(x),[.7,.2,.1][j]))});const cy=elementCycle(dayEl),support=s[dayEl]+s[cy.생],drain=s[cy.설]+s[cy.극]+s[cy.피극],ratio=Math.round(support/(support+drain||1)*100),state=ratio>=60?'신강':ratio<=40?'신약':'중화',candidates=state==='신강'?[cy.극,cy.설]:state==='신약'?[dayEl,cy.생]:[cy.극,cy.설];return {score:s,ratio,state,candidates:[...new Set(candidates)]}}
function tenGodFromStems(dayStem,otherStem){const e1=getHeavenlyStemElement(dayStem),e2=getHeavenlyStemElement(otherStem),same=stems.indexOf(dayStem)%2===stems.indexOf(otherStem)%2;if(e1===e2)return same?'비견':'겁재';const map={목:{생:'화',극:'토',피극:'금',피생:'수'},화:{생:'토',극:'금',피극:'수',피생:'목'},토:{생:'금',극:'수',피극:'목',피생:'화'},금:{생:'수',극:'목',피극:'화',피생:'토'},수:{생:'목',극:'화',피극:'토',피생:'금'}};const m=map[e1];if(e2===m.생)return same?'식신':'상관';if(e2===m.극)return same?'편재':'정재';if(e2===m.피극)return same?'편관':'정관';return same?'편인':'정인'}
function monthMainStem(branch){return {자:'계',축:'기',인:'갑',묘:'을',진:'무',사:'병',오:'정',미:'기',신:'경',유:'신',술:'무',해:'임'}[branch]}
function seasonClimate(branch){return {자:'한습',축:'한습',인:'한에서 온으로 이동',묘:'온습',진:'습',사:'열건',오:'열건',미:'열습',신:'조량',유:'조량',술:'조건',해:'한습'}[branch]||'중성'}
function advancedAnalysis(r,base){const main=monthMainStem(r.month.earthlyBranch),ge=tenGodFromStems(r.day.heavenlyStem,main),state=base.state,season=seasonClimate(r.month.earthlyBranch),yong=base.candidates[0],hee=elementCycle(yong).생,gi=state==='신강'?getHeavenlyStemElement(r.day.heavenlyStem):elementCycle(getHeavenlyStemElement(r.day.heavenlyStem)).극;return {main,ge,season,yong,hee,gi}}
function annualStemForYear(y){const s=['갑','을','병','정','무','기','경','신','임','계'],b=['자','축','인','묘','진','사','오','미','신','유','술','해'];return {heavenlyStem:s[(y-4)%10],earthlyBranch:b[(y-4)%12]}}
function annual2026(r){const year={heavenlyStem:'병',earthlyBranch:'오'},dayEl=getHeavenlyStemElement(r.day.heavenlyStem),yearEl=getHeavenlyStemElement(year.heavenlyStem),rel=relationAnalysis({...r,year}),dayBranch=r.day.earthlyBranch;return {year,stemGod:tenGodFromStems(r.day.heavenlyStem,year.heavenlyStem),dayEl,yearEl,relations:rel,branchRelation:relationPairType(dayBranch,year.earthlyBranch)}}
function relationPairType(a,b){const pairs={충:[['자','오'],['축','미'],['인','신'],['묘','유'],['진','술'],['사','해']],육합:[['자','축'],['인','해'],['묘','술'],['진','유'],['사','신'],['오','미']],해:[['자','미'],['축','오'],['인','사'],['묘','진'],['신','해'],['유','술']],파:[['자','유'],['축','진'],['인','해'],['묘','오'],['신','사'],['미','술']]};for(const [k,v] of Object.entries(pairs))if(v.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a)))return k;return '일치 관계 없음'}
function relationAnalysis(r){const bs=[r.year,r.month,r.day,r.hour].filter(Boolean).map(x=>x.earthlyBranch),out=[],pairs=(t,a)=>a.forEach(p=>{if(p.every(x=>bs.includes(x)))out.push(t+' · '+p.join(''))});pairs('충',[['자','오'],['축','미'],['인','신'],['묘','유'],['진','술'],['사','해']]);pairs('육합',[['자','축'],['인','해'],['묘','술'],['진','유'],['사','신'],['오','미']]);pairs('삼합',[['신','자','진'],['해','묘','미'],['인','오','술'],['사','유','축']]);pairs('방합',[['인','묘','진'],['사','오','미'],['신','유','술'],['해','자','축']]);pairs('해',[['자','미'],['축','오'],['인','사'],['묘','진'],['신','해'],['유','술']]);pairs('파',[['자','유'],['축','진'],['인','해'],['묘','오'],['신','사'],['미','술']]);return [...new Set(out)]}

const stemMeaning={

function addOptions(el, start, end, suffix=''){ for(let i=start;i<=end;i++) el.add(new Option(i+suffix,i)); }
addOptions(yearEl,1800,2300,'년'); addOptions(monthEl,1,12,'월'); addOptions(dayEl,1,31,'일');
yearEl.value=1993; monthEl.value=4; dayEl.value=12;

function refreshDays(){
  const y=Number(yearEl.value), m=Number(monthEl.value);
  const max=calendar==='lunar'?30:new Date(y,m,0).getDate();
  const current=Number(dayEl.value)||1;
  dayEl.innerHTML='';
  addOptions(dayEl,1,max,'일');
  dayEl.value=Math.min(current,max);
}
monthEl.addEventListener('change',refreshDays); yearEl.addEventListener('change',refreshDays);

document.querySelectorAll('[data-calendar]').forEach(btn=>btn.addEventListener('click',()=>{
  calendar=btn.dataset.calendar;
  document.querySelectorAll('[data-calendar]').forEach(b=>{const active=b.dataset.calendar===calendar;b.classList.toggle('active',active);b.setAttribute('aria-selected',active);});
  leapWrap.hidden=calendar!=='lunar';
  hint.textContent=calendar==='solar'?'양력 기준으로 생년월일을 선택해줘.':'음력 기준으로 생년월일을 선택해줘. 윤달이면 아래에서 윤달을 선택해줘.';
  yearEl.max=calendar==='solar'?2300:2100;
  yearEl.min=1800;
  refreshDays();
}));

function pillarText(p){return p?p.heavenlyStem+p.earthlyBranch:'—'}
function pillarHanja(p){return p?stemHanja[stems.indexOf(p.heavenlyStem)]+branchHanja[branches.indexOf(p.earthlyBranch)]:''}
function elementOf(p){return p?getHeavenlyStemElement(p.heavenlyStem)+' / '+getEarthlyBranchElement(p.earthlyBranch):''}
function renderPillar(label,p){return '<div class="saju-pillar"><small>'+label+'</small><strong>'+pillarText(p)+'</strong><em>'+pillarHanja(p)+' · '+elementOf(p)+'</em></div>'}
function safe(v){return v==null?'—':String(v)}
function tenGodCell(v){if(!v)return '—';if(typeof v==='string')return v;return safe(v.stem)+' / '+safe(v.branch)}

function getValues(){
  return {year:Number(yearEl.value),month:Number(monthEl.value),day:Number(dayEl.value)};
}
function elementCounts(r){
  const counts={목:0,화:0,토:0,금:0,수:0};
  [r.year,r.month,r.day,r.hour].forEach(p=>{
    if(!p)return;
    [p.heavenlyStem,p.earthlyBranch].forEach(ch=>{
      const el=stems.includes(ch)?getHeavenlyStemElement(ch):getEarthlyBranchElement(ch);
      if(el)counts[el]++;
    });
  });
  return counts;
}
function strongest(counts){
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]);
}
function meter(counts){
  const max=Math.max(1,...Object.values(counts));
  return '<div class="saju-meter">'+Object.entries(counts).map(([k,v])=>'<div class="saju-meter-row"><span>'+k+'</span><div class="saju-meter-bar"><i style="width:'+Math.round(v/max*100)+'%"></i></div><b>'+v+'</b></div>').join('')+'</div>';
}
function tenName(v){
  if(!v)return '정보 없음';
  if(typeof v==='string')return v;
  return safe(v.stem);
}
function tenSummary(ten){
  return [['년주',ten.year],['월주',ten.month],['일주',ten.day],['시주',ten.hour]].map(([l,v])=>'<span class="saju-pill">'+l+' · '+tenName(v)+'</span>').join('');
}

function longInterpret(r,counts,ten,luck){
  const dayStem=r.day.heavenlyStem, dayBranch=r.day.earthlyBranch, monthBranch=r.month.earthlyBranch;
  const order=strongest(counts), top=order[0][0], low=order[order.length-1][0];
  const dayEl=getHeavenlyStemElement(dayStem);
  const balance=order[0][1]-order[order.length-1][1];
  const strengthText=balance>=3?'오행 편중이 비교적 뚜렷한 편':balance===2?'특정 오행이 조금 더 두드러지는 편':'오행 분포가 비교적 고르게 섞인 편';
  return `
  <div class="saju-long">
    <div class="saju-highlight"><strong>${dayStem}일간 · ${dayEl}</strong><p>${stemMeaning[dayStem]||''}으로 해석하는 출발점이야. 일간은 사주에서 ‘나’를 대표하는 기준점이고, 다른 글자와의 관계를 통해 성향·재능·생활 패턴을 살펴봐.</p></div>
    <h3>① 기본 성향</h3>
    <p>${stemMeaning[dayStem]||''}이 중심에 있어. 다만 같은 일간이라도 월령, 통근, 주변 오행과 십신 배치가 달라지면 실제 표현 방식은 크게 달라질 수 있어. 그래서 일간 하나만 보고 성격을 단정하면 안 돼.</p>
    <h3>② 계절과 월령</h3>
    <p>태어난 달의 지지는 <b>${monthBranch}</b>야. 월주는 사주에서 계절의 기운을 읽는 중요한 기준이라서, 단순한 오행 개수보다 월령을 함께 보는 게 중요해. 현재 계산 결과는 <b>${monthBranch}</b>월을 기준으로 일간의 힘과 주변 기운을 해석하는 구조야.</p>
    <h3>③ 오행 균형</h3>
    <p>${strengthText}. 현재 가장 많이 잡히는 오행은 <b>${top}</b>이고, 상대적으로 적게 잡히는 오행은 <b>${low}</b>야. ${top}은 ${elemMeaning[top]}과 관련된 키워드를, ${low}은 상대적으로 보완이 필요한 영역을 살펴볼 때 참고할 수 있어. 단, ‘개수가 적다 = 무조건 나쁘다’는 뜻은 아니야.</p>
    ${meter(counts)}
    <h3>④ 십신 구조</h3>
    <p>십신은 일간을 기준으로 다른 천간·지지와의 생극제화 관계를 표현해. 현재 계산된 십신은 <b>${tenSummary(ten)}</b>처럼 나타나며, 재성·관성·인성·식상·비겁이 어느 자리에 놓이는지를 함께 봐야 실제 해석이 가능해.</p>
    <p>특히 월주와 일주 주변에 어떤 십신이 반복되는지, 시간에 어떤 기운이 자리하는지를 보는 것이 중요해. 이 페이지에서는 계산값을 먼저 정확히 보여주고, 특정 학파의 해석을 사실처럼 단정하지 않도록 구성했어.</p>
    <h3>⑤ 공망과 생활 해석</h3>
    <p>현재 일주의 공망은 <b>${safe((r.voidBranches||[]).join('·'))}</b>이야. 공망은 하나의 길흉 판정표라기보다 해당 글자가 어떤 방식으로 체감되는지 해석할 때 참고하는 요소야. 실제 판단에서는 원국 전체와 대운·세운의 움직임을 함께 봐야 해.</p>
    <h3>⑥ 대운 흐름</h3>
    <p>${luck?((luck.forward?'순행':'역행')+'으로 대운이 진행되며, 계산상 대운 시작은 약 '+safe(luck.startAge)+'세야. 세부 계산값은 '+safe(luck.startYears)+'년 '+safe(luck.startMonths)+'개월 '+safe(luck.startDays)+'일로 제공돼.'):'성별 정보에 따른 대운 계산값을 확인해줘.'} 대운은 10년 단위의 큰 흐름을 보는 자료지만, 어느 시기에 무엇이 무조건 일어난다고 단정하는 용도는 아니야.</p>
    <h3>⑦ 종합적으로 보면</h3>
    <p>${dayStem}일간을 중심으로 ${top}의 존재감이 상대적으로 크고 ${low}의 비중은 낮게 나타나. 따라서 강점은 ${elemMeaning[top]} 쪽에서 찾고, ${elemMeaning[low]}과 관련된 활동을 의식적으로 경험하면서 균형을 잡는 방식이 참고가 될 수 있어. 다만 실제 용신·희신은 오행 숫자만으로 정할 수 없으므로 월령·통근·합충형파해·십신 구조 등을 추가로 검토해야 해.</p>
  </div>`;
}

    const advanced=advancedAnalysis(r,analysis);
    const advancedPanel='<div class="saju-summary"><div class="saju-card"><div class="saju-kicker">STRUCTURE · 格局</div><h2>격국 참고 분석</h2><p class="saju-lead">월지 <b>'+r.month.earthlyBranch+'</b> · 본기 <b>'+advanced.main+'</b> · 격국 후보 <b>'+advanced.ge+'</b></p><p class="saju-note">월지 본기를 기준으로 한 간이 후보야. 투간·통근·합화·성패까지 포함한 확정 격국은 아니야.</p></div><div class="saju-card"><div class="saju-kicker">CLIMATE · 調候</div><h2>조후 참고 분석</h2><p class="saju-lead">월지 기준 <b>'+advanced.season+'</b> · 우선 검토 <b>'+advanced.yong+'</b></p><p class="saju-note">조후는 계절의 한난조습을 보는 관점이라 억부용신과 반드시 같은 오행이 되는 것은 아니야.</p></div></div><div class="saju-card"><div class="saju-kicker">BALANCE · 用喜忌</div><h2>용신 · 희신 · 기신 참고</h2><div class="saju-focus"><div><b>용신 후보</b><span>'+advanced.yong+'</span></div><div><b>희신 후보</b><span>'+advanced.hee+'</span></div><div><b>기신 후보</b><span>'+advanced.gi+'</span></div></div><p class="saju-note">신강·신약 참고값을 바탕으로 한 억부 관점의 자동 후보야. 조후·격국·통관이 다른 방향을 가리킬 수 있어.</p></div>';
    const annualPanel='<div class="saju-card"><div class="saju-kicker">2026 · 병오년</div><h2>2026 세운 분석</h2><p class="saju-lead"><b>丙午 · 병오</b> · 일간 기준 연간 천간 십신 <b>'+annual.stemGod+'</b> · 세운 오행 <b>'+annual.yearEl+'</b></p><div class="saju-focus"><div><b>연간</b><span>병화 · '+elemMeaning[annual.yearEl]+'</span></div><div><b>연지</b><span>오화 · '+zodiac['오']+'의 기운</span></div><div><b>일지 관계</b><span>'+annual.branchRelation+'</span></div><div><b>원국 관계</b><span>'+ (annual.relations.length?annual.relations.join(' · '):'주요 기본 관계 없음')+'</span></div></div><p class="saju-note">2026년은 병오(丙午)년이야. 사주 세운은 입춘 전후의 연도 경계, 원국·대운과의 결합을 함께 봐야 하므로 연간 하나만으로 길흉을 확정하지 않아.</p><h3>분야별 참고</h3><p class="saju-note">재물·사업은 '+(annual.yearEl===analysis.candidates[0]?'용신 후보와 같은 오행이 들어와 활용도를 높여볼 수 있는 해':'원국의 균형과 지출·확장 속도를 함께 점검하는 해')+'로 볼 수 있어. 직업·활동은 '+(annual.stemGod==='정관'||annual.stemGod==='편관'?'책임·직함·규칙':'표현·성과·관계·자원')+' 키워드를 중심으로 읽어볼 수 있어.</p></div>';
    const relationPanel='<div class="saju-panel"><h2>합·충·형·파·해 · 삼합·방합</h2><div class="saju-focus">'+(relations.length?relations.map(x=>'<div><b>'+x.split(' · ')[0]+'</b><span>'+x.split(' · ')[1]+'</span></div>').join(''):'<div><b>주요 관계 없음</b><span>기본 관계표에서 확인되지 않음</span></div>')+'</div><p class="saju-note">관계의 존재만으로 길흉을 결정하지 않고 위치와 대운·세운을 함께 봐야 해.</p></div>';
    const tenPanel='<div class="saju-panel"><h2>십신(十神) 상세</h2><table class="saju-table"><thead><tr><th>기둥</th><th>십신</th></tr></thead><tbody>'+tenRows+'</tbody></table><p class="saju-note">십신은 일간을 기준으로 비견·겁재·식신·상관·재성·관성·인성 등의 관계를 읽는 기본 도구야. 표의 값은 계산된 관계를 그대로 보여줘.</p></div>';
    const order=strongest(counts);
    const elementPanel='<div class="saju-panel"><h2>오행 분포와 핵심 포인트</h2><div class="saju-badges">'+Object.entries(counts).map(([k,v])=>'<span class="saju-badge">'+k+' '+v+' '+elemHanja[k]+'</span>').join('')+'</div>'+meter(counts)+'<p class="saju-note">가장 많은 오행: <b>'+order[0][0]+'</b> · 상대적으로 적은 오행: <b>'+order[order.length-1][0]+'</b></p></div>';
    const hiddenPanel='<div class="saju-panel"><h2>지장간 · 12운성</h2><p class="saju-note">각 지지에 숨어 있는 천간과 일간 기준 12운성을 함께 보여줘. 출생시간을 모른다면 시주는 계산상 임시값을 넣되 해석에서는 참고용으로만 취급해.</p><table class="saju-table"><thead><tr><th>기둥</th><th>지지</th><th>지장간</th><th>12운성</th></tr></thead><tbody>'+[['년주',r.year],['월주',r.month],['일주',r.day],['시주',r.hour]].map(([l,p])=>'<tr><td>'+l+'</td><td>'+p.earthlyBranch+'</td><td>'+hiddenText(p.earthlyBranch)+'</td><td>'+lifeStage(r.day.heavenlyStem,p.earthlyBranch)+'</td></tr>').join('')+'</tbody></table></div>';
    const timelineYears=[2026,2027,2028,2029,2030].map(y=>{const p=annualStemForYear(y),g=tenGodFromStems(r.day.heavenlyStem,p.heavenlyStem);return {y,p,g,rel:relationPairType(r.day.earthlyBranch,p.earthlyBranch)}});
    const timelinePanel='<div class="saju-panel"><h2>2026–2030 세운 타임라인</h2><p class="saju-note">일간 기준 십신과 일지와의 기본 관계를 연도별로 비교해.</p><div class="saju-timeline">'+timelineYears.map(x=>'<div class="'+(x.y===2026?'current':'')+'"><b>'+x.y+'</b><strong>'+x.p.heavenlyStem+x.p.earthlyBranch+'</strong><span>'+x.g+'</span><small>'+x.rel+'</small></div>').join('')+'</div></div>';
    const annualDetails=timelineYears.map(x=>{const el=getHeavenlyStemElement(x.p.heavenlyStem), yong=analysis.candidates[0], hee=advanced.hee, gi=advanced.gi, fit=el===yong?'용신 후보와 같은 오행':el===hee?'희신 후보와 같은 오행':el===gi?'기신 후보와 같은 오행':'중립 오행', luckRel=activeLuck?relationPairType(activeLuck.pillar?.earthlyBranch,x.p.earthlyBranch):'현재 대운 확인 필요'; return '<div class="saju-annual-card '+(x.y===2026?'current':'')+'"><div><b>'+x.y+'</b><strong>'+x.p.heavenlyStem+x.p.earthlyBranch+'</strong></div><span>'+x.g+' · '+el+'</span><p>일지 관계: '+x.rel+' · 오행 방향: '+fit+' · 대운 관계: '+luckRel+'</p><small>'+({2026:'활동성과 표현을 키우되 확장 속도와 지출을 함께 관리하는 해',2027:'현실적인 정리와 기반 관리가 중요해지는 흐름',2028:'기준·계약·실행력과 결과를 점검하기 좋은 흐름',2029:'관계와 자원 배분을 세밀하게 조정할 필요가 있는 흐름',2030:'장기 계획을 현실적인 구조로 굳히는 흐름'}[x.y]||'원국과 대운을 함께 보며 판단하는 흐름')+'</small></div>'}).join('');
    const annualDetailPanel='<div class="saju-panel"><h2>2026–2030 연도별 상세 흐름</h2><p class="saju-note">연간 천간·지지, 십신, 일지 관계, 용·희·기 후보와의 오행 방향을 한 화면에서 비교해.</p><div class="saju-annual-grid">'+annualDetails+'</div></div>';
    const crossText=activeLuck?('현재 대운 '+safe(activeLuck.korean)+'이 '+(relationPairType(activeLuck.pillar?.earthlyBranch,'오')||'2026 병오년')+'과 어떻게 만나는지 원국의 '+analysis.state+' 및 용신 후보 '+analysis.candidates[0]+'과 함께 비교해.'): '현재 대운을 자동 판정할 수 없어 대운표를 기준으로 확인해.';
    const crossPanel='<div class="saju-card"><div class="saju-kicker">LUCK × YEAR</div><h2>대운 × 2026 세운 교차</h2><p class="saju-lead">'+(activeLuck?'현재 나이 기준 <b>'+currentAge+'세</b> · 현재 대운 <b>'+safe(activeLuck.korean)+'</b> · '+safe(activeLuck.age)+'세 시작':'대운 계산값 확인 필요')+'</p><div class="saju-focus"><div><b>원국</b><span>'+analysis.state+' · 용신 후보 '+analysis.candidates[0]+'</span></div><div><b>대운</b><span>'+ (activeLuck?safe(activeLuck.pillar?.heavenlyStem)+safe(activeLuck.pillar?.earthlyBranch):'확인 필요')+'</span></div><div><b>2026</b><span>丙午 · '+annual2026(r).stemGod+'</span></div></div><p class="saju-note">'+crossText+' 대운은 장기 배경이고 세운은 그 안에서 작동하는 연간 자극으로 보며, 원국·대운·세운이 같은 방향으로 움직이는지 확인해.</p></div>';
    const luckVisualPanel=luck?'<div class="saju-panel"><h2>대운 흐름 한눈에 보기</h2><p class="saju-note">각 대운의 시작 나이를 기준으로 현재 위치를 자동 강조해.</p><div class="saju-luck-grid">'+luckCards+'</div></div>':'';
    const luckPanel=luck?'<div class="saju-panel"><h2>대운(大運)</h2><p class="saju-note"><b>'+ (luck.forward?'순행':'역행')+'</b> · 대운 시작 약 <b>'+safe(luck.startAge)+'세</b> · 세부 '+safe(luck.startYears)+'년 '+safe(luck.startMonths)+'개월 '+safe(luck.startDays)+'일</p><table class="saju-table"><thead><tr><th>시작 나이</th><th>대운</th><th>간·지</th></tr></thead><tbody>'+luckRows+'</tbody></table></div>':'';
    const calendarPanel='<div class="saju-section-grid"><div class="saju-panel"><h2>입력 날짜 변환</h2><p class="saju-note">양력 '+solar.year+'-'+String(solar.month).padStart(2,'0')+'-'+String(solar.day).padStart(2,'0')+' · 음력 '+lunar.year+'년 '+lunar.month+'월 '+lunar.day+'일'+(lunar.isLeapMonth?' (윤달)':'')+'</p></div><div class="saju-panel"><h2>계산 설정</h2><p class="saju-note">'+(document.getElementById('solarTime').checked?'진태양시 보정 사용 · 경도 '+longitude.value+'°E':'한국 표준시 그대로 계산')+' · '+document.getElementById('dayBoundary').selectedOptions[0].text+'</p></div></div>';

    result.innerHTML=pillarTable+info+strengthPanel+advancedPanel+tenPanel+elementPanel+hiddenPanel+relationPanel+annualPanel+crossPanel+timelinePanel+annualDetailPanel+fieldReading+luckVisualPanel+luckPanel+calendarPanel+'<div class="saju-card"><div class="saju-kicker">DETAILED READING</div><h2>상세 사주 풀이</h2>'+longInterpret(r,counts,ten,luck)+'</div><div class="saju-panel"><h2>해석할 때 알아둘 점</h2><p class="saju-note">이 결과는 한국식 사주명리학에서 사용하는 계산값을 바탕으로 한 참고용 풀이야. 절기·진태양시·자시 경계에 따라 일부 만세력과 결과가 달라질 수 있어. 또한 용신·희신·격국·신살·12운성 등은 학파와 계산법에 따라 차이가 있으므로, 오행 개수만으로 길흉을 단정하지 않아.</p></div>';
    result.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(err){
    result.innerHTML='<div class="saju-error">계산할 수 없는 입력이야. 양력/음력 날짜와 윤달 여부, 출생시간을 확인해줘.<br><small>'+safe(err.message)+'</small></div>';
  }
});
</script>
