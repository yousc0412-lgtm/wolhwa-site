<!doctype html>
<html lang="ko">
<head>

<link rel="stylesheet" href="style.css">
<style>
.saju-wrap{max-width:1000px;margin:auto;padding:55px 24px 90px}
.saju-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:24px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.saju-field{display:grid;gap:7px}.saju-field label{font-size:12px;font-weight:700;color:#9da5ad}
.saju-field input,.saju-field select{height:48px;border:1px solid #343a40;border-radius:10px;padding:0 12px;background:#101315;color:#e7eaed;font:inherit}
.saju-field input:focus,.saju-field select:focus{outline:2px solid var(--accent)}
.saju-options{grid-column:1/-1;display:flex;gap:18px;flex-wrap:wrap;padding-top:4px}
.saju-options label{display:flex;align-items:center;gap:7px;font-size:11px;color:#9aa2aa}
.saju-options input{accent-color:var(--accent)}
.saju-button{grid-column:1/-1;height:50px;border:0;border-radius:11px;background:#e9edf0;color:#101214;font-weight:800;cursor:pointer}
.saju-help{grid-column:1/-1;font-size:10px;color:#69727a;line-height:1.7;margin:-4px 0 0}
.saju-result{margin-top:22px;display:grid;gap:14px}
.saju-panel{padding:23px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.saju-panel h2{font-size:20px;margin:0 0 15px;letter-spacing:-.5px}
.saju-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.saju-pillar{padding:17px 8px;text-align:center;border-radius:13px;background:#20252a;border:1px solid #2d3339}
.saju-pillar small{display:block;color:#7e8790;font-size:10px;margin-bottom:7px}.saju-pillar strong{font-size:25px}.saju-pillar em{display:block;color:#777f87;font-style:normal;font-size:9px;margin-top:4px}
.saju-table{width:100%;border-collapse:collapse;font-size:11px}.saju-table th,.saju-table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:center}.saju-table th{color:#747d85;font-weight:600}.saju-table td{color:#d8dde1}
.saju-badges{display:flex;gap:8px;flex-wrap:wrap}.saju-badge{padding:7px 11px;border-radius:100px;background:#20252a;border:1px solid #30363c;color:#cfd5da;font-size:11px}
.saju-note{font-size:12px;color:#858d95;line-height:1.85}.saju-muted{color:#68717a;font-size:10px}.saju-error{padding:16px;border-radius:12px;background:#25191b;border:1px solid #553238;color:#e7b9be;font-size:12px}
.saju-section-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.saju-current{padding:16px;border-radius:14px;background:#20252a;border:1px solid #2d3339}.saju-current strong{font-size:22px}.saju-current small{display:block;color:#7e8790;font-size:10px;margin-top:4px}
.saju-disclaimer{font-size:10px;color:#68717a;line-height:1.7;margin-top:16px}
@media(max-width:760px){.saju-form{grid-template-columns:1fr 1fr}.saju-section-grid{grid-template-columns:1fr}}
@media(max-width:600px){.saju-wrap{padding:42px 17px 65px}.saju-form{grid-template-columns:1fr;padding:18px}.saju-options,.saju-button,.saju-help{grid-column:1}.saju-grid{grid-template-columns:repeat(2,1fr)}.saju-panel{padding:18px 15px}.saju-table{font-size:10px}.saju-table th,.saju-table td{padding:9px 5px}}

.saju-calendar-switch{grid-column:1/-1;display:flex;gap:0;border:1px solid #343a40;border-radius:12px;overflow:hidden;background:#101315}
.saju-calendar-switch button{flex:1;height:44px;border:0;background:transparent;color:#858d95;font:inherit;font-weight:800;cursor:pointer}
.saju-calendar-switch button.active{background:var(--accent);color:#111418}
.saju-date-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.saju-date-grid select{width:100%}
.saju-long{line-height:1.95;color:#c5cbd0;font-size:13px}
.saju-long p{margin:0 0 12px}.saju-long h3{font-size:15px;color:#e9edf0;margin:20px 0 9px}
.saju-highlight{padding:16px;border-radius:14px;background:#20252a;border:1px solid #2d3339;margin-bottom:12px}
.saju-highlight strong{font-size:18px;color:#e9edf0}
.saju-meter{display:grid;gap:7px;margin-top:12px}.saju-meter-row{display:grid;grid-template-columns:42px 1fr 35px;gap:8px;align-items:center;font-size:11px}.saju-meter-bar{height:7px;border-radius:99px;background:#30363c;overflow:hidden}.saju-meter-bar i{display:block;height:100%;background:var(--accent)}
.saju-pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#252b30;margin:2px;font-size:10px;color:#cdd3d8}
@media(max-width:600px){.saju-date-grid{grid-template-columns:1fr 1fr}.saju-date-grid select:first-child{grid-column:1/-1}}
<style id="saju-pro">.saju-summary{display:grid;grid-template-columns:1.3fr .7fr;gap:14px;margin-bottom:14px}.saju-card{padding:23px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}.saju-card h2{font-size:19px;margin:0 0 15px}.saju-kicker{font-size:10px;letter-spacing:1.5px;color:#b9d86a;font-weight:800;margin-bottom:8px}.saju-big{font-size:30px;font-weight:900;letter-spacing:-1.4px;margin:0 0 8px}.saju-lead{font-size:13px;line-height:1.9;color:#c8ced2}.saju-key{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.saju-key div{padding:12px;border:1px solid #2d3339;border-radius:12px;background:#1b2024}.saju-key b{display:block;font-size:16px}.saju-key span{font-size:9px;color:#78818a}.saju-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.saju-reading{font-size:13px;line-height:2;color:#c8ced2}.saju-reading h3{font-size:15px;color:#eef0f2;margin:22px 0 7px}.saju-reading h3:first-child{margin-top:0}.saju-reading p{margin:0 0 9px}.saju-callout{padding:15px 16px;border-left:3px solid var(--accent);border-radius:0 12px 12px 0;background:#1b2024;margin:12px 0}@media(max-width:760px){.saju-summary,.saju-two{grid-template-columns:1fr}}</style></head>

<header class="site-header"><a class="brand" href="index.html" aria-label="월화 홈"><span class="brand-mark">月花</span><span>월화 <b>계산기</b></span></a><nav><a href="calculators.html">계산기</a><a href="downloads.html">다운로드·도구</a><a href="blog.html">블로그</a></nav></header>
<main>
<section class="category-hero"><p class="eyebrow">WOLHWA SAJU</p><h1>무료 사주 <span>만세력</span></h1><p>한국식 사주명리학의 기본 명식을 정확하게 계산해 보세요.</p></section>
<section class="saju-wrap">
<form class="saju-form" id="sajuForm">
<div class="saju-calendar-switch" role="tablist" aria-label="달력 선택">
  <button type="button" class="active" data-calendar="solar" aria-selected="true">양력</button>
  <button type="button" data-calendar="lunar" aria-selected="false">음력</button>
</div>
<div class="saju-field" style="grid-column:1/-1">
  <label>생년월일</label>
  <div class="saju-date-grid">
    <select id="birthYear" aria-label="출생 연도"></select>
    <select id="birthMonth" aria-label="출생 월"></select>
    <select id="birthDay" aria-label="출생 일"></select>
  </div>
  <p class="saju-muted" id="calendarHint">양력 기준으로 생년월일을 선택해줘.</p>
</div>
<div class="saju-field"><label for="birthTime">출생시간</label><input id="birthTime" type="time" value="10:00"></div>
<div class="saju-field"><label for="gender">성별</label><select id="gender"><option value="male">남성</option><option value="female">여성</option></select></div>
<div class="saju-field"><label for="location">출생지 경도</label><select id="location"><option value="127.0">서울·인천·경기권 (약 127°E)</option><option value="126.56">인천 (약 126.56°E)</option><option value="126.98">서울 (약 126.98°E)</option><option value="126.53">제주 (약 126.53°E)</option><option value="129.07">부산 (약 129.07°E)</option><option value="128.60">대구 (약 128.60°E)</option><option value="129.31">울산 (약 129.31°E)</option><option value="127.73">대전 (약 127.73°E)</option></select></div>
<div class="saju-field" id="leapWrap" hidden><label for="isLeap">음력 윤달</label><select id="isLeap"><option value="false">평달</option><option value="true">윤달</option></select></div>
<div class="saju-options">
<label><input id="solarTime" type="checkbox"> 진태양시 보정</label>
<label><input id="equation" type="checkbox" checked> 균시차 보정</label>
<select id="dayBoundary" aria-label="자시 날짜 경계"><option value="midnight">자시 날짜 경계: 자정 기준</option><option value="jasi">자시 날짜 경계: 23시 기준</option><option value="splitJasi">자시: 일주는 자정·시주 천간은 23시</option></select>
</div>
<p class="saju-help">양력·음력을 위에서 바로 전환할 수 있어. 음력은 윤달 여부까지 선택하고, 입력한 날짜를 기준으로 사주와 양력/음력 날짜를 함께 계산해줘.</p>
<button class="saju-button" type="submit">무료 사주 만세력 보기</button>
</form>
<div id="result" class="saju-result" hidden></div>
</section>
</main>
<footer class="site-footer"><a class="brand" href="index.html"><span class="brand-mark">月花</span><span>월화 <b>계산기</b></span></a><p>생활에 필요한 도구와 정보를 한곳에.</p></footer>

<script type="module">
import { calculateFourPillars, solarToLunar, lunarToSolar, getHeavenlyStemElement, getEarthlyBranchElement } from 'https://esm.sh/manseryeok@2.0.0';

const form=document.getElementById('sajuForm');
const result=document.getElementById('result');
const yearEl=document.getElementById('birthYear'), monthEl=document.getElementById('birthMonth'), dayEl=document.getElementById('birthDay');
const time=document.getElementById('birthTime'), leapEl=document.getElementById('isLeap'), leapWrap=document.getElementById('leapWrap');
const hint=document.getElementById('calendarHint');
let calendar='solar';

const stems=['갑','을','병','정','무','기','경','신','임','계'];
const branches=['자','축','인','묘','진','사','오','미','신','유','술','해'];
const stemHanja=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const branchHanja=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const elemHanja={목:'木',화:'火',토:'土',금:'金',수:'水'};
const zodiac={자:'쥐',축:'소',인:'호랑이',묘:'토끼',진:'용',사:'뱀',오:'말',미:'양',신:'원숭이',유:'닭',술:'개',해:'돼지'};const hiddenStems={자:['임','계'],축:['계','신','기'],인:['무','병','갑'],묘:['갑','을'],진:['을','계','무'],사:['무','경','병'],오:['병','기','정'],미:['정','을','기'],신:['무','임','경'],유:['경','신'],술:['신','정','무'],해:['무','갑','임']};
const twelveNames=['장생','목욕','관대','건록','제왕','쇠','병','사','묘','절','태','양'];
const twelveStart={갑:'해',을:'오',병:'인',정:'유',무:'인',기:'유',경:'사',신:'자',임:'신',계:'묘'};
const branchIndex=Object.fromEntries(branches.map((x,i)=>[x,i]));
function lifeStage(stem,branch){const s=branchIndex[twelveStart[stem]],b=branchIndex[branch],yin=['을','정','기','신','계'].includes(stem);return twelveNames[yin?(s-b+12)%12:(b-s+12)%12]}
const branchRelations={충:[['자','오'],['축','미'],['인','신'],['묘','유'],['진','술'],['사','해']],육합:[['자','축'],['인','해'],['묘','술'],['진','유'],['사','신'],['오','미']],해:[['자','미'],['축','오'],['인','사'],['묘','진'],['신','해'],['유','술']],파:[['자','유'],['축','진'],['인','해'],['묘','午'],['신','사'],['미','술']]};
function findRelations(r){const ps=[r.year,r.month,r.day,r.hour].filter(Boolean),out=[];for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++)for(const type of Object.keys(branchRelations))for(const pair of branchRelations[type]){const a=pair[0],b=pair[1].replace('午','오');if((ps[i].earthlyBranch===a&&ps[j].earthlyBranch===b)||(ps[i].earthlyBranch===b&&ps[j].earthlyBranch===a))out.push(type+' · '+a+b)}return [...new Set(out)]}
function hiddenText(branch){return (hiddenStems[branch]||[]).map(x=>x+'('+getHeavenlyStemElement(x)+')').join(' · ')}
const stemMeaning={
갑:'큰 나무처럼 곧게 성장하고 목표를 향해 밀고 나가는 힘',
을:'덩굴과 화초처럼 유연하게 움직이며 관계와 환경에 적응하는 힘',
병:'태양처럼 밝게 드러나고 추진력과 표현력을 발휘하는 힘',
정:'촛불처럼 섬세하게 집중하고 한 가지를 깊이 파고드는 힘',
무:'큰 산과 넓은 땅처럼 버티고 책임지며 기반을 만드는 힘',
기:'논밭처럼 현실적인 문제를 세심하게 관리하고 조율하는 힘',
경:'단단한 쇠처럼 결단하고 정리하며 원칙을 세우는 힘',
신:'보석처럼 정교하게 다듬고 기준과 완성도를 중요하게 보는 힘',
임:'큰 물처럼 넓게 움직이며 정보·변화·기회를 읽는 힘',
계:'비와 이슬처럼 섬세하게 관찰하고 상황에 맞춰 유연하게 움직이는 힘'
};
const elemMeaning={
목:'성장·확장·시작·기획·학습',화:'표현·열정·추진·주목·활동성',토:'현실·관리·안정·책임·축적',금:'기준·결단·정리·실행·완성도',수:'정보·유연성·이동·관찰·소통'
};

function addOptions(el, start, end, suffix=''){ for(let i=start;i<=end;i++) el.add(new Option(i+suffix,i)); }
addOptions(yearEl,1800,2300,'년'); addOptions(monthEl,1,12,'월'); addOptions(dayEl,1,31,'일');
yearEl.value=1993; monthEl.value=4; dayEl.value=12;

function refreshDays(){
  const y=Number(yearEl.value), m=Number(monthEl.value);
  const max=calendar==='lunar'?30:new Date(y,m,0).getDate();
  const current=Number(dayEl.value)||1;
  dayEl.innerHTML='';
  addOptions(dayEl,1,max,'일');
  dayEl.value=Math.min(current,max);
}
monthEl.addEventListener('change',refreshDays); yearEl.addEventListener('change',refreshDays);

document.querySelectorAll('[data-calendar]').forEach(btn=>btn.addEventListener('click',()=>{
  calendar=btn.dataset.calendar;
  document.querySelectorAll('[data-calendar]').forEach(b=>{const active=b.dataset.calendar===calendar;b.classList.toggle('active',active);b.setAttribute('aria-selected',active);});
  leapWrap.hidden=calendar!=='lunar';
  hint.textContent=calendar==='solar'?'양력 기준으로 생년월일을 선택해줘.':'음력 기준으로 생년월일을 선택해줘. 윤달이면 아래에서 윤달을 선택해줘.';
  yearEl.max=calendar==='solar'?2300:2100;
  yearEl.min=1800;
  refreshDays();
}));

function pillarText(p){return p?p.heavenlyStem+p.earthlyBranch:'—'}
function pillarHanja(p){return p?stemHanja[stems.indexOf(p.heavenlyStem)]+branchHanja[branches.indexOf(p.earthlyBranch)]:''}
function elementOf(p){return p?getHeavenlyStemElement(p.heavenlyStem)+' / '+getEarthlyBranchElement(p.earthlyBranch):''}
function renderPillar(label,p){return '<div class="saju-pillar"><small>'+label+'</small><strong>'+pillarText(p)+'</strong><em>'+pillarHanja(p)+' · '+elementOf(p)+'</em></div>'}
function safe(v){return v==null?'—':String(v)}
function tenGodCell(v){if(!v)return '—';if(typeof v==='string')return v;return safe(v.stem)+' / '+safe(v.branch)}

function getValues(){
  return {year:Number(yearEl.value),month:Number(monthEl.value),day:Number(dayEl.value)};
}
function elementCounts(r){
  const counts={목:0,화:0,토:0,금:0,수:0};
  [r.year,r.month,r.day,r.hour].forEach(p=>{
    if(!p)return;
    [p.heavenlyStem,p.earthlyBranch].forEach(ch=>{
      const el=stems.includes(ch)?getHeavenlyStemElement(ch):getEarthlyBranchElement(ch);
      if(el)counts[el]++;
    });
  });
  return counts;
}
function strongest(counts){
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]);
}
function meter(counts){
  const max=Math.max(1,...Object.values(counts));
  return '<div class="saju-meter">'+Object.entries(counts).map(([k,v])=>'<div class="saju-meter-row"><span>'+k+'</span><div class="saju-meter-bar"><i style="width:'+Math.round(v/max*100)+'%"></i></div><b>'+v+'</b></div>').join('')+'</div>';
}
function tenName(v){
  if(!v)return '정보 없음';
  if(typeof v==='string')return v;
  return safe(v.stem);
}
function tenSummary(ten){
  return [['년주',ten.year],['월주',ten.month],['일주',ten.day],['시주',ten.hour]].map(([l,v])=>'<span class="saju-pill">'+l+' · '+tenName(v)+'</span>').join('');
}

function longInterpret(r,counts,ten,luck){
  const dayStem=r.day.heavenlyStem, dayBranch=r.day.earthlyBranch, monthBranch=r.month.earthlyBranch;
  const order=strongest(counts), top=order[0][0], low=order[order.length-1][0];
  const dayEl=getHeavenlyStemElement(dayStem);
  const balance=order[0][1]-order[order.length-1][1];
  const strengthText=balance>=3?'오행 편중이 비교적 뚜렷한 편':balance===2?'특정 오행이 조금 더 두드러지는 편':'오행 분포가 비교적 고르게 섞인 편';
  return `
  <div class="saju-long">
    <div class="saju-highlight"><strong>${dayStem}일간 · ${dayEl}</strong><p>${stemMeaning[dayStem]||''}으로 해석하는 출발점이야. 일간은 사주에서 ‘나’를 대표하는 기준점이고, 다른 글자와의 관계를 통해 성향·재능·생활 패턴을 살펴봐.</p></div>
    <h3>① 기본 성향</h3>
    <p>${stemMeaning[dayStem]||''}이 중심에 있어. 다만 같은 일간이라도 월령, 통근, 주변 오행과 십신 배치가 달라지면 실제 표현 방식은 크게 달라질 수 있어. 그래서 일간 하나만 보고 성격을 단정하면 안 돼.</p>
    <h3>② 계절과 월령</h3>
    <p>태어난 달의 지지는 <b>${monthBranch}</b>야. 월주는 사주에서 계절의 기운을 읽는 중요한 기준이라서, 단순한 오행 개수보다 월령을 함께 보는 게 중요해. 현재 계산 결과는 <b>${monthBranch}</b>월을 기준으로 일간의 힘과 주변 기운을 해석하는 구조야.</p>
    <h3>③ 오행 균형</h3>
    <p>${strengthText}. 현재 가장 많이 잡히는 오행은 <b>${top}</b>이고, 상대적으로 적게 잡히는 오행은 <b>${low}</b>야. ${top}은 ${elemMeaning[top]}과 관련된 키워드를, ${low}은 상대적으로 보완이 필요한 영역을 살펴볼 때 참고할 수 있어. 단, ‘개수가 적다 = 무조건 나쁘다’는 뜻은 아니야.</p>
    ${meter(counts)}
    <h3>④ 십신 구조</h3>
    <p>십신은 일간을 기준으로 다른 천간·지지와의 생극제화 관계를 표현해. 현재 계산된 십신은 <b>${tenSummary(ten)}</b>처럼 나타나며, 재성·관성·인성·식상·비겁이 어느 자리에 놓이는지를 함께 봐야 실제 해석이 가능해.</p>
    <p>특히 월주와 일주 주변에 어떤 십신이 반복되는지, 시간에 어떤 기운이 자리하는지를 보는 것이 중요해. 이 페이지에서는 계산값을 먼저 정확히 보여주고, 특정 학파의 해석을 사실처럼 단정하지 않도록 구성했어.</p>
    <h3>⑤ 공망과 생활 해석</h3>
    <p>현재 일주의 공망은 <b>${safe((r.voidBranches||[]).join('·'))}</b>이야. 공망은 하나의 길흉 판정표라기보다 해당 글자가 어떤 방식으로 체감되는지 해석할 때 참고하는 요소야. 실제 판단에서는 원국 전체와 대운·세운의 움직임을 함께 봐야 해.</p>
    <h3>⑥ 대운 흐름</h3>
    <p>${luck?((luck.forward?'순행':'역행')+'으로 대운이 진행되며, 계산상 대운 시작은 약 '+safe(luck.startAge)+'세야. 세부 계산값은 '+safe(luck.startYears)+'년 '+safe(luck.startMonths)+'개월 '+safe(luck.startDays)+'일로 제공돼.'):'성별 정보에 따른 대운 계산값을 확인해줘.'} 대운은 10년 단위의 큰 흐름을 보는 자료지만, 어느 시기에 무엇이 무조건 일어난다고 단정하는 용도는 아니야.</p>
    <h3>⑦ 종합적으로 보면</h3>
    <p>${dayStem}일간을 중심으로 ${top}의 존재감이 상대적으로 크고 ${low}의 비중은 낮게 나타나. 따라서 강점은 ${elemMeaning[top]} 쪽에서 찾고, ${elemMeaning[low]}과 관련된 활동을 의식적으로 경험하면서 균형을 잡는 방식이 참고가 될 수 있어. 다만 실제 용신·희신은 오행 숫자만으로 정할 수 없으므로 월령·통근·합충형파해·십신 구조 등을 추가로 검토해야 해.</p>
  </div>`;
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  result.hidden=false; result.innerHTML='<div class="saju-panel"><p class="saju-note">정밀 만세력 계산 중…</p></div>';
  try{
    const v=getValues(), [hh,mm]=(time.value||'10:00').split(':').map(Number);
    const opts={year:v.year,month:v.month,day:v.day,hour:hh,minute:mm,isLunar:calendar==='lunar',isLeapMonth:calendar==='lunar'&&leapEl.value==='true',gender:document.getElementById('gender').value,dayBoundary:document.getElementById('dayBoundary').value};
    if(document.getElementById('solarTime').checked) opts.trueSolarTime={longitude:Number(document.getElementById('location').value),applyEquationOfTime:document.getElementById('equation').checked,applyHistoricalDst:true};
    const r=calculateFourPillars(opts), counts=elementCounts(r), ten=r.tenGods||{}, luck=r.luckPillars;
    const solar=calendar==='lunar'?lunarToSolar(v.year,v.month,v.day,opts.isLeapMonth):v;
    const lunar=solarToLunar(solar.year,solar.month,solar.day);
    const luckRows=luck?.pillars?.map(x=>'<tr><td>'+safe(x.age)+'세</td><td><b>'+safe(x.korean)+'</b></td><td>'+safe(x.pillar?.heavenlyStem)+' / '+safe(x.pillar?.earthlyBranch)+'</td></tr>').join('')||'';

    const info='<div class="saju-summary"><div class="saju-card"><div class="saju-kicker">WOLHWA · SAJU ANALYSIS</div><h2 class="saju-big">'+safe(r.day.heavenlyStem)+'일간 · '+safe(getHeavenlyStemElement(r.day.heavenlyStem))+'</h2><p class="saju-lead">'+(stemMeaning[r.day.heavenlyStem]||'일간을 중심으로 원국 전체의 구조를 살펴봅니다.')+'</p><div class="saju-key"><div><b>'+safe(zodiac[r.year.earthlyBranch])+'</b><span>띠</span></div><div><b>'+safe(r.day.earthlyBranch)+'</b><span>일지</span></div><div><b>'+safe((r.voidBranches||[]).join('·'))+'</b><span>공망</span></div></div></div><div class="saju-card"><div class="saju-kicker">CORE BALANCE</div><h2>오행 핵심</h2><p class="saju-lead">강한 기운 <b>'+strongest(counts)[0][0]+'</b> · 상대적으로 적은 기운 <b>'+strongest(counts).at(-1)[0]+'</b></p>'+meter(counts)+'</div></div>';
    const tenRows=[['년주',ten.year],['월주',ten.month],['일주',ten.day],['시주',ten.hour]].map(([label,v])=>'<tr><td>'+label+'</td><td>'+tenGodCell(v)+'</td></tr>').join('');
    const tenPanel='<div class="saju-panel"><h2>십신(十神) 상세</h2><table class="saju-table"><thead><tr><th>기둥</th><th>십신</th></tr></thead><tbody>'+tenRows+'</tbody></table><p class="saju-note">십신은 일간을 기준으로 비견·겁재·식신·상관·재성·관성·인성 등의 관계를 읽는 기본 도구야. 표의 값은 계산된 관계를 그대로 보여줘.</p></div>';
    const order=strongest(counts);
    const elementPanel='<div class="saju-panel"><h2>오행 분포와 핵심 포인트</h2><div class="saju-badges">'+Object.entries(counts).map(([k,v])=>'<span class="saju-badge">'+k+' '+v+' '+elemHanja[k]+'</span>').join('')+'</div>'+meter(counts)+'<p class="saju-note">가장 많은 오행: <b>'+order[0][0]+'</b> · 상대적으로 적은 오행: <b>'+order[order.length-1][0]+'</b></p></div>';
    const hiddenPanel='<div class="saju-panel"><h2>지장간 · 12운성</h2><p class="saju-note">각 지지에 숨어 있는 천간과 일간 기준 12운성을 함께 보여줘.</p><table class="saju-table"><thead><tr><th>기둥</th><th>지지</th><th>지장간</th><th>12운성</th></tr></thead><tbody>'+[['년주',r.year],['월주',r.month],['일주',r.day],['시주',r.hour]].map(([l,p])=>'<tr><td>'+l+'</td><td>'+p.earthlyBranch+'</td><td>'+hiddenText(p.earthlyBranch)+'</td><td>'+lifeStage(r.day.heavenlyStem,p.earthlyBranch)+'</td></tr>').join('')+'</tbody></table></div>';
    const luckPanel=luck?'<div class="saju-panel"><h2>대운(大運)</h2><p class="saju-note"><b>'+ (luck.forward?'순행':'역행')+'</b> · 대운 시작 약 <b>'+safe(luck.startAge)+'세</b> · 세부 '+safe(luck.startYears)+'년 '+safe(luck.startMonths)+'개월 '+safe(luck.startDays)+'일</p><table class="saju-table"><thead><tr><th>시작 나이</th><th>대운</th><th>간·지</th></tr></thead><tbody>'+luckRows+'</tbody></table></div>':'';
    const calendarPanel='<div class="saju-section-grid"><div class="saju-panel"><h2>입력 날짜 변환</h2><p class="saju-note">양력 '+solar.year+'-'+String(solar.month).padStart(2,'0')+'-'+String(solar.day).padStart(2,'0')+' · 음력 '+lunar.year+'년 '+lunar.month+'월 '+lunar.day+'일'+(lunar.isLeapMonth?' (윤달)':'')+'</p></div><div class="saju-panel"><h2>계산 설정</h2><p class="saju-note">'+(document.getElementById('solarTime').checked?'진태양시 보정 사용 · 경도 '+document.getElementById('location').value+'°E':'한국 표준시 그대로 계산')+' · '+document.getElementById('dayBoundary').selectedOptions[0].text+'</p></div></div>';

    result.innerHTML=info+tenPanel+elementPanel+hiddenPanel+luckPanel+calendarPanel+'<div class="saju-card"><div class="saju-kicker">DETAILED READING</div><h2>상세 사주 풀이</h2>'+longInterpret(r,counts,ten,luck)+'</div><div class="saju-panel"><h2>해석할 때 알아둘 점</h2><p class="saju-note">이 결과는 한국식 사주명리학에서 사용하는 계산값을 바탕으로 한 참고용 풀이야. 절기·진태양시·자시 경계에 따라 일부 만세력과 결과가 달라질 수 있어. 또한 용신·희신·격국·신살·12운성 등은 학파와 계산법에 따라 차이가 있으므로, 오행 개수만으로 길흉을 단정하지 않아.</p></div>';
    result.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(err){
    result.innerHTML='<div class="saju-error">계산할 수 없는 입력이야. 양력/음력 날짜와 윤달 여부, 출생시간을 확인해줘.<br><small>'+safe(err.message)+'</small></div>';
  }
});
</script>
