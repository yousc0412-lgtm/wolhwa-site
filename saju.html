<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>무료 사주 만세력 | 월화</title>
<meta name="description" content="한국천문연구원 KASI 기준 데이터를 사용하는 무료 사주 만세력. 사주팔자, 십신, 오행, 공망, 대운과 음양력 변환을 확인하세요.">
<link rel="stylesheet" href="style.css">
<style>
.saju-wrap{max-width:1000px;margin:auto;padding:55px 24px 90px}
.saju-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:24px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.saju-field{display:grid;gap:7px}.saju-field label{font-size:12px;font-weight:700;color:#9da5ad}
.saju-field input,.saju-field select{height:48px;border:1px solid #343a40;border-radius:10px;padding:0 12px;background:#101315;color:#e7eaed;font:inherit}
.saju-field input:focus,.saju-field select:focus{outline:2px solid var(--accent)}
.saju-options{grid-column:1/-1;display:flex;gap:18px;flex-wrap:wrap;padding-top:4px}
.saju-options label{display:flex;align-items:center;gap:7px;font-size:11px;color:#9aa2aa}
.saju-options input{accent-color:var(--accent)}
.saju-button{grid-column:1/-1;height:50px;border:0;border-radius:11px;background:#e9edf0;color:#101214;font-weight:800;cursor:pointer}
.saju-help{grid-column:1/-1;font-size:10px;color:#69727a;line-height:1.7;margin:-4px 0 0}
.saju-result{margin-top:22px;display:grid;gap:14px}
.saju-panel{padding:23px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.saju-panel h2{font-size:20px;margin:0 0 15px;letter-spacing:-.5px}
.saju-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.saju-pillar{padding:17px 8px;text-align:center;border-radius:13px;background:#20252a;border:1px solid #2d3339}
.saju-pillar small{display:block;color:#7e8790;font-size:10px;margin-bottom:7px}.saju-pillar strong{font-size:25px}.saju-pillar em{display:block;color:#777f87;font-style:normal;font-size:9px;margin-top:4px}
.saju-table{width:100%;border-collapse:collapse;font-size:11px}.saju-table th,.saju-table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:center}.saju-table th{color:#747d85;font-weight:600}.saju-table td{color:#d8dde1}
.saju-badges{display:flex;gap:8px;flex-wrap:wrap}.saju-badge{padding:7px 11px;border-radius:100px;background:#20252a;border:1px solid #30363c;color:#cfd5da;font-size:11px}
.saju-note{font-size:12px;color:#858d95;line-height:1.85}.saju-muted{color:#68717a;font-size:10px}.saju-error{padding:16px;border-radius:12px;background:#25191b;border:1px solid #553238;color:#e7b9be;font-size:12px}
.saju-section-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.saju-current{padding:16px;border-radius:14px;background:#20252a;border:1px solid #2d3339}.saju-current strong{font-size:22px}.saju-current small{display:block;color:#7e8790;font-size:10px;margin-top:4px}
.saju-disclaimer{font-size:10px;color:#68717a;line-height:1.7;margin-top:16px}
@media(max-width:760px){.saju-form{grid-template-columns:1fr 1fr}.saju-section-grid{grid-template-columns:1fr}}
@media(max-width:600px){.saju-wrap{padding:42px 17px 65px}.saju-form{grid-template-columns:1fr;padding:18px}.saju-options,.saju-button,.saju-help{grid-column:1}.saju-grid{grid-template-columns:repeat(2,1fr)}.saju-panel{padding:18px 15px}.saju-table{font-size:10px}.saju-table th,.saju-table td{padding:9px 5px}}
</style>
</head>
<body>
<header class="site-header"><a class="brand" href="index.html" aria-label="월화 홈"><span class="brand-mark">月花</span><span>월화 <b>계산기</b></span></a><nav><a href="calculators.html">계산기</a><a href="downloads.html">다운로드·도구</a><a href="blog.html">블로그</a></nav></header>
<main>
<section class="category-hero"><p class="eyebrow">WOLHWA SAJU</p><h1>무료 사주 <span>만세력</span></h1><p>한국식 사주명리학의 기본 명식을 정확하게 계산해 보세요.</p></section>
<section class="saju-wrap">
<form class="saju-form" id="sajuForm">
<div class="saju-field"><label for="calendar">달력</label><select id="calendar"><option value="solar">양력</option><option value="lunar">음력</option></select></div>
<div class="saju-field"><label for="birthDate">생년월일</label><input id="birthDate" type="date" required></div>
<div class="saju-field"><label for="birthTime">출생시간</label><input id="birthTime" type="time" value="10:00"></div>
<div class="saju-field" id="lunarMonthWrap" hidden><label for="lunarMonth">음력 월</label><select id="lunarMonth"></select></div>
<div class="saju-field" id="lunarDayWrap" hidden><label for="lunarDay">음력 일</label><select id="lunarDay"></select></div>
<div class="saju-field" id="leapWrap" hidden><label for="isLeap">윤달</label><select id="isLeap"><option value="false">평달</option><option value="true">윤달</option></select></div>
<div class="saju-field"><label for="gender">성별</label><select id="gender"><option value="male">남성</option><option value="female">여성</option></select></div>
<div class="saju-field"><label for="location">출생지 경도</label><select id="location"><option value="127.0">서울·인천·경기권 (약 127°E)</option><option value="126.56">인천 (약 126.56°E)</option><option value="126.98">서울 (약 126.98°E)</option><option value="126.53">제주 (약 126.53°E)</option><option value="129.07">부산 (약 129.07°E)</option><option value="128.60">대구 (약 128.60°E)</option><option value="129.31">울산 (약 129.31°E)</option><option value="127.73">대전 (약 127.73°E)</option></select></div>
<div class="saju-options">
<label><input id="solarTime" type="checkbox"> 진태양시 보정</label>
<label><input id="equation" type="checkbox" checked> 균시차 보정</label>
<select id="dayBoundary" aria-label="자시 날짜 경계"><option value="midnight">자시 날짜 경계: 자정 기준</option><option value="jasi">자시 날짜 경계: 23시 기준</option><option value="splitJasi">자시: 일주는 자정·시주 천간은 23시</option></select>
</div>
<p class="saju-help">정밀 만세력은 절입 시각을 기준으로 연주·월주를 판단합니다. 진태양시와 자시 경계는 유파에 따라 달라질 수 있어 직접 선택할 수 있게 했습니다.</p>
<button class="saju-button" type="submit">무료 사주 만세력 보기</button>
</form>
<div id="result" class="saju-result" hidden></div>
</section>
</main>
<footer class="site-footer"><a class="brand" href="index.html"><span class="brand-mark">月花</span><span>월화 <b>계산기</b></span></a><p>생활에 필요한 도구와 정보를 한곳에.</p></footer>

<script type="module">
import { calculateFourPillars, solarToLunar, lunarToSolar, getHeavenlyStemElement, getEarthlyBranchElement } from 'https://esm.sh/manseryeok@2.0.0';

const form=document.getElementById('sajuForm');
const calendar=document.getElementById('calendar');
const birthDate=document.getElementById('birthDate');
const time=document.getElementById('birthTime');
const result=document.getElementById('result');
const lunarMonth=document.getElementById('lunarMonth');
const lunarDay=document.getElementById('lunarDay');
const isLeap=document.getElementById('isLeap');
const monthWrap=document.getElementById('lunarMonthWrap');
const dayWrap=document.getElementById('lunarDayWrap');
const leapWrap=document.getElementById('leapWrap');

for(let m=1;m<=12;m++) lunarMonth.add(new Option(m+'월',m));
for(let d=1;d<=30;d++) lunarDay.add(new Option(d+'일',d));

calendar.addEventListener('change',()=>{
  const lunar=calendar.value==='lunar';
  monthWrap.hidden=!lunar; dayWrap.hidden=!lunar; leapWrap.hidden=!lunar;
  birthDate.required=!lunar;
});

const stems=['갑','을','병','정','무','기','경','신','임','계'];
const branches=['자','축','인','묘','진','사','오','미','신','유','술','해'];
const stemHanja=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const branchHanja=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const elemHanja={목:'木',화:'火',토:'土',금:'金',수:'水'};
const zodiac={자:'쥐',축:'소',인:'호랑이',묘:'토끼',진:'용',사:'뱀',오:'말',미:'양',신:'원숭이',유:'닭',술:'개',해:'돼지'};

function pillarText(p){
  if(!p)return '—';
  return p.heavenlyStem+p.earthlyBranch;
}
function pillarHanja(p){
  if(!p)return '';
  return stemHanja[stems.indexOf(p.heavenlyStem)]+branchHanja[branches.indexOf(p.earthlyBranch)];
}
function elementOf(p){
  return p ? getHeavenlyStemElement(p.heavenlyStem)+' / '+getEarthlyBranchElement(p.earthlyBranch) : '';
}
function renderPillar(label,p){
  const k=pillarText(p);
  return '<div class="saju-pillar"><small>'+label+'</small><strong>'+k+'</strong><em>'+pillarHanja(p)+' · '+elementOf(p)+'</em></div>';
}
function safe(v){return v==null?'—':String(v)}
function tenGodCell(v){
  if(!v)return '—';
  if(typeof v==='string')return v;
  return safe(v.stem)+' / '+safe(v.branch);
}
function getBirthValues(){
  if(calendar.value==='solar'){
    const [y,m,d]=birthDate.value.split('-').map(Number);
    return {year:y,month:m,day:d};
  }
  return {year:Number(birthDate.value.slice(0,4)),month:Number(lunarMonth.value),day:Number(lunarDay.value)};
}
function interpret(dayStem, counts, ten){
  const names={갑:'갑목(甲木) · 큰 나무처럼 성장과 추진을 중시하는 성향',을:'을목(乙木) · 유연하게 뻗어나가며 관계와 적응을 중시하는 성향',병:'병화(丙火) · 밝게 드러내고 추진하는 성향',정:'정화(丁火) · 집중력과 섬세함을 바탕으로 깊게 파고드는 성향',무:'무토(戊土) · 버티고 쌓아가는 힘을 중시하는 성향',기:'기토(己土) · 실무와 관리, 조율에 강점을 두는 성향',경:'경금(庚金) · 결단과 실행, 원칙을 중시하는 성향',신:'신금(辛金) · 정교함과 기준, 완성도를 중시하는 성향',임:'임수(壬水) · 넓게 움직이며 정보와 흐름을 중시하는 성향',계:'계수(癸水) · 관찰력과 유연함, 세밀한 판단을 중시하는 성향'};
  const max=Math.max(...Object.values(counts)); const rich=Object.entries(counts).filter(([,v])=>v===max).map(([k])=>k).join('·');
  return '<p class="saju-note"><b>'+safe(dayStem)+'일간</b> · '+(names[dayStem]||'')+'</p><p class="saju-note">대표 오행 집계에서는 <b>'+rich+'</b>의 비중이 상대적으로 높습니다. 오행 개수만으로 용신·희신을 단정하지 않고, 월령·통근·십신 구조를 함께 봐야 합니다.</p>';
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  result.hidden=false; result.innerHTML='<div class="saju-panel"><p class="saju-note">정밀 만세력 계산 중…</p></div>';
  try{
    const v=getBirthValues();
    const [hh,mm]=(time.value||'00:00').split(':').map(Number);
    const opts={
      year:v.year,month:v.month,day:v.day,hour:hh,minute:mm,
      isLunar:calendar.value==='lunar',
      isLeapMonth:calendar.value==='lunar' && isLeap.value==='true',
      gender:document.getElementById('gender').value,
      dayBoundary:document.getElementById('dayBoundary').value
    };
    if(document.getElementById('solarTime').checked){
      opts.trueSolarTime={longitude:Number(document.getElementById('location').value),applyEquationOfTime:document.getElementById('equation').checked,applyHistoricalDst:true};
    }
    const r=calculateFourPillars(opts);
    const o=r.toObject();
    const pillars=[r.year,r.month,r.day,r.hour];
    const chars=[];
    pillars.forEach(p=>{if(p){chars.push(p.heavenlyStem,p.earthlyBranch)}});
    const counts={목:0,화:0,토:0,금:0,수:0};
    chars.forEach(ch=>{try{const el=stems.includes(ch)?getHeavenlyStemElement(ch):getEarthlyBranchElement(ch);if(el)counts[el]++}catch{}});
    const dayStem=r.day.heavenlyStem;
    const ten=r.tenGods||{};
    const luck=r.luckPillars;
    const solar=(calendar.value==='lunar')?lunarToSolar(v.year,v.month,v.day,opts.isLeapMonth):v;
    const lunar=solarToLunar(solar.year,solar.month,solar.day);

    let luckRows='';
    if(luck?.pillars?.length){
      luckRows=luck.pillars.map(x=>'<tr><td>'+safe(x.age)+'세</td><td><b>'+safe(x.korean)+'</b></td><td>'+safe(x.pillar?.heavenlyStem)+' / '+safe(x.pillar?.earthlyBranch)+'</td></tr>').join('');
    }

    const info='<div class="saju-panel"><h2>사주 원국</h2><div class="saju-grid">'+renderPillar('년주',r.year)+renderPillar('월주',r.month)+renderPillar('일주',r.day)+renderPillar('시주',r.hour)+'</div><p class="saju-note">띠: '+safe(zodiac[r.year.earthlyBranch])+' · 일간: <b>'+safe(dayStem)+'</b> · 공망: <b>'+safe((r.voidBranches||[]).join('·'))+'</b></p></div>';

    const tenRows=[['년주',ten.year],['월주',ten.month],['일주',ten.day],['시주',ten.hour]].map(([label,v])=>'<tr><td>'+label+'</td><td>'+tenGodCell(v)+'</td></tr>').join('');
    const tenPanel='<div class="saju-panel"><h2>십신(十神)</h2><table class="saju-table"><thead><tr><th>기둥</th><th>일간을 기준으로 한 십신</th></tr></thead><tbody>'+tenRows+'</tbody></table><p class="saju-muted">십신은 일간과 각 천간·지지의 생극제화 관계를 표시한 계산 결과야.</p></div>';

    const elementPanel='<div class="saju-panel"><h2>오행 분포</h2><div class="saju-badges">'+Object.entries(counts).map(([k,v])=>'<span class="saju-badge">'+k+' '+v+' '+elemHanja[k]+'</span>').join('')+'</div>'+interpret(dayStem,counts,ten)+'</div>';

    const luckPanel=luck?'<div class="saju-panel"><h2>대운(大運)</h2><p class="saju-note"><b>'+ (luck.forward?'순행':'역행')+'</b> · 대운 시작 약 <b>'+safe(luck.startAge)+'세</b> · 세부 '+safe(luck.startYears)+'년 '+safe(luck.startMonths)+'개월 '+safe(luck.startDays)+'일</p><table class="saju-table"><thead><tr><th>시작 나이</th><th>대운</th><th>간·지</th></tr></thead><tbody>'+luckRows+'</tbody></table></div>':'';

    const calendarPanel='<div class="saju-section-grid"><div class="saju-panel"><h2>입력 날짜</h2><p class="saju-note">양력 '+solar.year+'-'+String(solar.month).padStart(2,'0')+'-'+String(solar.day).padStart(2,'0')+' · 음력 '+lunar.year+'년 '+lunar.month+'월 '+lunar.day+'일'+(lunar.isLeapMonth?' (윤달)':'')+'</p></div><div class="saju-panel"><h2>계산 설정</h2><p class="saju-note">'+(document.getElementById('solarTime').checked?'진태양시 보정 사용 · 경도 '+document.getElementById('location').value+'°E':'한국 표준시 그대로 계산')+' · '+document.getElementById('dayBoundary').selectedOptions[0].text+'</p></div></div>';

    result.innerHTML=info+tenPanel+elementPanel+luckPanel+calendarPanel+'<div class="saju-panel"><h2>기본 해석</h2>'+interpret(dayStem,counts,ten)+'<p class="saju-disclaimer">월화의 만세력은 계산 결과를 제공하는 참고용 도구야. 절기·진태양시·자시 관법에 따라 일부 만세력과 결과가 다를 수 있으며, 용신·희신·격국·신살처럼 학파별 차이가 큰 해석은 계산값만으로 단정하지 않아.</p></div>';
  }catch(err){
    result.innerHTML='<div class="saju-error">계산할 수 없는 입력이야. 날짜·시간·음력 윤달 여부를 확인해줘.<br><small>'+safe(err.message)+'</small></div>';
  }
});
</script>
</body>
</html>
