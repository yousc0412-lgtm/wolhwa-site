<style>
.dday-wrap{max-width:820px;margin:0 auto}.dday-card{background:#fff;border:1px solid #e8e8e8;border-radius:28px;padding:42px 24px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.06)}.dday-label{font-size:1.05rem;font-weight:700;color:#666}.dday{font-size:clamp(5rem,18vw,10rem);line-height:1;font-weight:900;letter-spacing:-.07em;margin:18px 0}.date{font-size:1.1rem;font-weight:700}.sub{margin-top:10px;color:#777}.notice{margin-top:28px;padding:16px;border-radius:14px;background:#f6f6f6;font-size:.92rem;color:#666}
</style>

<body>
<header class="site-header"><a class="brand" href="index.html" aria-label="월화 홈"><span class="brand-mark">月花</span><span>월화 <b>타이머</b></span></a><nav><a href="calculators.html">계산기</a><a href="timers.html">타이머</a><a href="downloads.html">다운로드·도구</a><a href="blog.html">블로그</a></nav></header>
<main><section class="category-hero"><p class="eyebrow">WOLHWA CSAT D-DAY</p><h1>수능까지 남은<br><span>시간을 확인해.</span></h1><p>2027학년도 대학수학능력시험까지 남은 날짜를 한눈에 확인하세요.</p></section>
<section class="section dday-wrap"><div class="dday-card">
<div class="dday-label">2027학년도 대학수학능력시험</div>
<div class="dday" id="dday">D-</div>
<div class="date">2026년 11월 19일 목요일</div>
<div class="sub" id="detail">계산 중...</div>
<div class="notice">수능 시험일 기준으로 매일 자동 계산됩니다.</div>
</div></section></main>
<footer class="site-footer"><a class="brand" href="index.html"><span class="brand-mark">月花</span><span>월화 <b>타이머</b></span></a><p>시험일까지 남은 시간을 한눈에 확인하세요.</p></footer>
<script>
const target=new Date('2026-11-19T00:00:00+09:00');
function update(){
 const now=new Date(), diff=target-now, day=Math.max(0,Math.ceil(diff/86400000));
 const el=document.getElementById('dday'), detail=document.getElementById('detail');
 if(diff>0){el.textContent='D-'+day; detail.textContent=day+'일 남았습니다. 오늘도 차근차근 준비해보세요.'}
 else if(now.toDateString()===target.toDateString()){el.textContent='D-DAY'; detail.textContent='오늘은 2027학년도 대학수학능력시험입니다.'}
 else {el.textContent='D+0'; detail.textContent='2027학년도 대학수학능력시험이 종료되었습니다.'}
}
update(); setInterval(update,60000);
</script>
</body></html>
