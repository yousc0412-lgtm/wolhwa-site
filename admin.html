<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>월화 관리자</title><link rel="stylesheet" href="style.css"><style>.admin{max-width:780px;margin:40px auto;padding:24px}.panel{border:1px solid #ddd;border-radius:16px;padding:24px;margin:18px 0;background:white}.panel input,.panel textarea{display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0 16px;border:1px solid #ccc;border-radius:8px;font:inherit}.panel textarea{min-height:180px}.btn{padding:11px 16px;border:0;border-radius:8px;background:#171717;color:white;cursor:pointer;margin:4px}.danger{background:#9b2525}.muted{color:#666;font-size:14px}.hidden{display:none}.postrow{border-top:1px solid #ddd;padding:14px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.status{white-space:pre-wrap}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">月</span><span>월화 <b>관리자</b></span></a><nav><a href="blog.html">블로그 보기</a></nav></header><main class="admin"><h1>월화 블로그 관리</h1><p class="muted">관리자 로그인 후 글을 작성하고 수정하거나 삭제할 수 있습니다.</p><section class="panel" id="loginPanel"><h2>관리자 로그인</h2><form id="loginForm"><label>관리자 비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button class="btn">로그인</button></form></section><section id="editorPanel" class="hidden"><section class="panel"><h2 id="formTitle">새 글 작성</h2><form id="postForm"><input id="postId" type="hidden"><label>제목<input id="title" maxlength="160" required></label><label>본문<textarea id="body" maxlength="30000" required></textarea></label><button class="btn">저장하기</button><button class="btn" type="button" id="resetBtn">새 글 작성</button><button class="btn danger" type="button" id="logoutBtn">로그아웃</button></form><p class="status" id="status"></p></section><section class="panel"><h2>게시글 목록</h2><div id="list">불러오는 중…</div></section></section></main><script>
const $=id=>document.getElementById(id);async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'요청을 처리하지 못했습니다.');return d}function showAdmin(){ $('loginPanel').classList.add('hidden');$('editorPanel').classList.remove('hidden');loadPosts()}function resetForm(){$('postId').value='';$('title').value='';$('body').value='';$('formTitle').textContent='새 글 작성'}async function loadPosts(){try{const d=await api('/api/posts?admin=1');$('list').replaceChildren();if(!d.posts.length){$('list').textContent='아직 게시글이 없습니다.';return}for(const p of d.posts){const row=document.createElement('div');row.className='postrow';const label=document.createElement('span');label.textContent=p.title;const actions=document.createElement('span');const edit=document.createElement('button');edit.className='btn';edit.textContent='수정';edit.onclick=()=>{$('postId').value=p.id;$('title').value=p.title;$('body').value=p.body;$('formTitle').textContent='게시글 수정';window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='btn danger';del.textContent='삭제';del.onclick=async()=>{if(!confirm('이 글을 삭제할까요?'))return;try{await api('/api/posts/'+p.id,{method:'DELETE'});await loadPosts()}catch(e){$('status').textContent=e.message}};actions.append(edit,del);row.append(label,actions);$('list').append(row)}}catch(e){$('list').textContent=e.message}}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('status').textContent='로그인했습니다.';showAdmin()}catch(e){$('status').textContent=e.message}};$('postForm').onsubmit=async e=>{e.preventDefault();const id=$('postId').value;const data={title:$('title').value,body:$('body').value};try{await api(id?'/api/posts/'+id:'/api/posts',{method:id?'PUT':'POST',body:JSON.stringify(data)});$('status').textContent='저장했습니다.';resetForm();await loadPosts()}catch(e){$('status').textContent=e.message}};$('resetBtn').onclick=resetForm;$('logoutBtn').onclick=async()=>{try{await api('/api/logout',{method:'POST'});location.reload()}catch(e){$('status').textContent=e.message}};api('/api/session').then(d=>{if(d.authenticated)showAdmin()}).catch(()=>{});
</script></body></html>
